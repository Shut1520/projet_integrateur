; platformio.ini — Configuration du projet firmware ESP32 (SAI).
;
; Cible : ESP32 DevKit (38 pins) — framework Arduino (C++).
; Style : fonctions courtes, non-bloquant, scheduler par millis().
;
; Commandes (depuis ce dossier Iot/) :
;   pio run                      -> compile
;   pio run --target upload      -> flashe la carte
;   pio device monitor           -> moniteur serie (115200 par defaut)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bibliotheques toutes non-bloquantes / utilisees par le firmware
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1

; Pile plus large pour la gestion TLS + JSON + HTTP
board_build.flash_size = 4MB
board_build.partitions = default.csv

; Activer les logs serie
build_flags =
    -DCORE_DEBUG_LEVEL=3
