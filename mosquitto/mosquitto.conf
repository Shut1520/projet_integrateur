# mosquitto.conf — Config du broker SAI.
#
# Deux listeners exposes par CE fichier :
#   - 8883  (MQTT TLS, CA autosignee)            → ESP32 / backend/ CLI
#   - 9001  (WebSocket SANS TLS, dev)            → frontend web (temps reel)
# Le port 1883 (dev local, sans TLS) est volontairement PROPOSE mais commente :
# sur cette machine il est deja occupe par le service Windows Mosquitto (config
# par defaut, inutilise par SAI). Si le 1883 du service est libere, decommenter
# le bloc ci-dessous pour activer un acces local non-chiffre (debug).
#
# Particularite Mosquitto v2.x : les perimetres (allow_anonymous) sont definis
# par listener ; on les declare donc explicitement sur chaque listener.

# ─── General ───
# Les chemins relatifs ci-dessous sont resolus par rapport au REPERTOIRE DE
# LANCEMENT. Lancer mosquitto depuis le dossier mosquitto/ (voir scripts).
per_listener_settings true
persistence true
persistence_location data

# ─── Listener dev local : 1883 SANS TLS (commenté, occupe par le service) ───
# listener 1883 0.0.0.0
# protocol mqtt
# allow_anonymous false
# password_file passwd
# acl_file acl

# ─── Listener TLS : 8883 ───
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file passwd
acl_file acl
cafile certs/mosquitto_ca.crt
certfile certs/mosquitto_server.crt
keyfile certs/mosquitto_server.key
tls_version tlsv1.2

# ─── Listener WebSocket dev : 9001 (frontend React) ───
# SANS TLS pour le dev (certificat autosigne penible dans un navigateur).
# Pour la prod, couvrir 9001 avec wss (proxy nginx/reverse TLS).
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file passwd
acl_file acl

# ─── Logs vers console ───
log_dest stdout
log_type all
connection_messages true
